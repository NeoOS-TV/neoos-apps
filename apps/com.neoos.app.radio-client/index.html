<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoRadio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <div id="app-container">
        
        <div id="sidebar">
            <div class="sidebar-title">NeoRadio</div>
            <div class="nav-item active" data-target="top-stations">
                <span class="material-symbols-sharp">radio</span>
                Top Sender
            </div>
            <div class="nav-item" data-target="favorites">
                <span class="material-symbols-sharp">star</span>
                Favoriten
            </div>
            <div class="nav-item" data-target="search">
                <span class="material-symbols-sharp">search</span>
                Sender Suchen
            </div>
          <div class="nav-item shortcut-item" data-target="shortcut-comedy" style="margin-top: auto; border-top: 1px solid #333; padding-top: 25px; color: #ffcc00;">
                <span class="material-symbols-sharp">sentiment_very_satisfied</span>
                B&C Kaffee-Stream
            </div>
        </div>

        <div id="content-area">
            <h2 class="section-title" id="current-section-title">Top Radiosender</h2>
            
            <div id="search-bar-container" style="display: none; margin-bottom: 30px;">
                <input type="text" id="radio-search-input" placeholder="Sendernamen eingeben und ENTER drücken..." autocomplete="off">
            </div>

            <div class="grid-container" id="radio-grid">
                </div>
        </div>

    </div>

    <div id="radio-playing-overlay">
        <img id="radio-now-img" class="radio-now-logo-large" src="" alt="Radio Logo">
        
        <div id="radio-now-name" class="radio-now-title">Sendername</div>
        <div id="radio-now-song" class="radio-now-song">Lade Live-Songinfo...</div>
        <div id="radio-now-genre" class="radio-now-sub">Genre</div>
        
        <div class="audio-visualizer" id="radio-visualizer">
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
        </div>
        
        <div class="player-controls-row">
            <div class="control-btn" data-action="toggle-play" id="btn-play">
                <span class="material-symbols-sharp">pause</span>
            </div>
            <div class="control-btn" data-action="toggle-fav" id="btn-fav">
                <span class="material-symbols-sharp">star_border</span>
            </div>
            <div class="control-btn" data-action="close-player" id="btn-close">
                <span class="material-symbols-sharp">close</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
