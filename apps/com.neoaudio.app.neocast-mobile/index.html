<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoTV Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="app-container">
    <div id="sidebar">
        <div class="sidebar-title">NeoTV</div>
        <div class="nav-item active" id="menu-iptv" onclick="changeMenu(0)">
            <span class="material-symbols-sharp">tv</span> <span class="nav-text">Live IPTV</span>
        </div>
        <div class="nav-item" id="menu-mediathek" onclick="changeMenu(1)">
            <span class="material-symbols-sharp">movie</span> <span class="nav-text">Mediatheken</span>
        </div>
        <div class="nav-item" id="menu-local" onclick="changeMenu(2)">
            <span class="material-symbols-sharp">folder_open</span> <span class="nav-text">Lokale Medien</span>
        </div>
    </div>

    <div id="content-area">
        <h1 class="section-title" id="area-title">Live IPTV</h1>
        <div class="grid-container" id="grid"></div>
    </div>
</div>

<input type="file" id="local-folder-picker" webkitdirectory directory multiple style="display: none;" onchange="handleFolderSelected(event)">

<div id="add-channel-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="material-symbols-sharp modal-icon-header">add_circle</span>
            <h3>Neuen IPTV Sender</h3>
        </div>
        <div class="input-row">
            <input type="text" id="add-title" placeholder="Sendername (z.B. ProSieben)">
            <input type="text" id="add-url" placeholder="Stream URL (.m3u8)">
            <input type="text" id="add-logo" placeholder="Logo Bild-URL (optional)">
        </div>
        <div class="modal-buttons">
            <button id="add-btn" onclick="addNewChannel()">Speichern</button>
            <button class="neutral-btn" onclick="closeAddModal()">Abbrechen</button>
        </div>
    </div>
</div>

<div id="manage-channels-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="material-symbols-sharp modal-icon-header">settings</span>
            <h3 id="manage-modal-title">Sender verwalten</h3>
        </div>
        
        <div id="manage-list-view">
            <div id="own-channels-list"></div>
            <div class="modal-buttons">
                <button class="neutral-btn" onclick="closeManageModal()">Schließen</button>
            </div>
        </div>

        <div id="manage-edit-view" style="display: none;">
            <div class="input-row">
                <input type="text" id="edit-title" placeholder="Sendername">
                <input type="text" id="edit-url" placeholder="Stream URL (.m3u8)">
                <input type="text" id="edit-logo" placeholder="Logo Bild-URL">
            </div>
            <div class="modal-buttons">
                <button id="save-edit-btn" onclick="saveEditedChannel()">Speichern</button>
                <button class="danger-btn" onclick="deleteChannel()">Löschen</button>
                <button class="neutral-btn" onclick="backToManageList()">Zurück</button>
            </div>
        </div>
    </div>
</div>

<div id="player-overlay">
    <button class="close-overlay-btn" onclick="closeOverlays()">✕</button>
    <video id="native-player" autoplay controls playsinline></video>
</div>

<div id="webview-overlay">
    <button class="close-overlay-btn" onclick="closeOverlays()">✕</button>
    <iframe id="ard-webview" src=""></iframe>
</div>

<script src="script.js"></script>
</body>
</html>
